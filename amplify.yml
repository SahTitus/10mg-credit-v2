version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        - corepack enable
        - yarn install --frozen-lockfile
    build:
      commands:
        - nvm use 22
        - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        - corepack enable
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
